<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 594" role="img" aria-label="Open-Photonics Tutorial cover: a ring resonator beside a bus waveguide, glowing on a dark chip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0c2340"/><stop offset="1" stop-color="#081526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a8a" stop-opacity="0.55"/><stop offset="1" stop-color="#ff5a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bus" x1="0" x2="1">
      <stop offset="0" stop-color="#e0b85a"/><stop offset="0.48" stop-color="#ffd98a"/><stop offset="0.52" stop-color="#7fb8f0" stop-opacity="0.55"/><stop offset="1" stop-color="#7fb8f0" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7fb8f0" stroke-opacity="0.07" stroke-width="1"/></pattern>
  </defs>
  <rect width="420" height="594" fill="url(#bg)"/>
  <rect width="420" height="594" fill="url(#grid)"/>
  <rect x="16" y="16" width="388" height="562" rx="10" fill="none" stroke="#78aae1" stroke-opacity="0.3"/>
  <!-- grating coupler -->
  <g fill="#7fb8f0" fill-opacity="0.5">
    <rect x="44" y="300" width="4" height="40" rx="1"/><rect x="52" y="298" width="4" height="44" rx="1"/><rect x="60" y="296" width="4" height="48" rx="1"/><rect x="68" y="294" width="4" height="52" rx="1"/><rect x="76" y="292" width="4" height="56" rx="1"/>
  </g>
  <!-- ring and glow -->
  <circle cx="232" cy="236" r="104" fill="url(#glow)"/>
  <circle cx="232" cy="236" r="78" fill="none" stroke="#ff7aa2" stroke-width="7"/>
  <circle cx="232" cy="236" r="78" fill="none" stroke="#ffd0dc" stroke-width="1.6" stroke-dasharray="3 9"/>
  <!-- bus waveguide -->
  <path d="M84 320 H376" stroke="url(#bus)" stroke-width="7" stroke-linecap="round"/>
  <!-- heater over the ring -->
  <path d="M190 172 A78 78 0 0 1 300 196" fill="none" stroke="#c98a3e" stroke-width="3" stroke-opacity="0.8"/>
  <!-- spectrum: a dip at resonance -->
  <path d="M60 430 H190 C205 430 210 470 222 470 C234 470 239 430 254 430 H360" fill="none" stroke="#7fe0a0" stroke-width="2"/>
  <text x="60" y="420" fill="#aacdf0" fill-opacity="0.7" font-family="monospace" font-size="10">through port</text>
  <text x="36" y="70" fill="#5fe1ec" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">OPEN-PHOTONICS</text>
  <text x="36" y="110" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Silicon Photonics</text>
  <text x="36" y="144" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">and Lasers</text>
  <text x="36" y="520" fill="#d7e6f7" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic">from waveguides to tested chips</text>
  <text x="36" y="552" fill="#aacdf0" fill-opacity="0.75" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5">Si · SiN · TFLN · BTO · InP</text>
</svg>
