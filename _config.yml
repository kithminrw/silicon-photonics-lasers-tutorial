title: "Open-Photonics"
description: >-
  Silicon Photonics and Lasers, from Waveguides to Tested Chips: an open, interactive tutorial on
  integrated photonics across the Si, SiN, TFLN, BTO and InP platforms, with live demos, open PDK
  devices in 3D and labs that use only free tools.

theme: just-the-docs

# The Pages workflow passes the real base path, so these only matter for local builds.
# Served by GitHub Pages at https://www.kithminrw.com/silicon-photonics-lasers-tutorial/ (the account's
# user site carries the custom domain www.kithminrw.com, so project sites appear under it).
url: https://www.kithminrw.com
baseurl: /silicon-photonics-lasers-tutorial

favicon_ico: "/favicon.ico"
color_scheme: wafer

aux_links:
  "GitHub":
    - "https://github.com/kithminrw/silicon-photonics-lasers-tutorial"
aux_links_new_tab: false

nav_external_links:
  - title: Source on GitHub
    url: https://github.com/kithminrw/silicon-photonics-lasers-tutorial

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/kithminrw/silicon-photonics-lasers-tutorial"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

last_edit_timestamp: false
enable_copy_code_button: true

compress_html:
  ignore:
    envs: all

kramdown:
  input: GFM
  hard_wrap: false

# Plain Jekyll gives pages no layout, so give the tutorial pages the theme's layout here.
defaults:
  - scope:
      path: "chapters"
    values:
      layout: "default"
  - scope:
      path: "parts"
    values:
      layout: "default"
  - scope:
      path: "appendices"
    values:
      layout: "default"
  - scope:
      path: "preface.md"
    values:
      layout: "default"
  - scope:
      path: "references.md"
    values:
      layout: "default"
  - scope:
      path: "devices-3d.md"
    values:
      layout: "default"
  - scope:
      path: "course-map.md"
    values:
      layout: "default"
  - scope:
      path: "labs"
      type: "pages"
    values:
      layout: "default"

exclude:
  - .claude/
  - tools/
  - figsrc/
  - labs/*.png
  - README.md
  - HANDOFF.md
  - LICENSE*
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
  - .venv/
