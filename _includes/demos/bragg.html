{% include demos/assets.html %}
<div class="bd" id="bdBragg" role="group" aria-label="Interactive demo: reflection spectrum of a waveguide Bragg grating">
  <div class="bd-head"><span>// try it · waveguide Bragg grating (transfer matrices)</span>
    <span class="bd-seg" role="group" aria-label="Apodisation"><button type="button" data-apo="0" aria-pressed="true">uniform</button><button type="button" data-apo="1" aria-pressed="false">Gaussian apodised</button></span>
    <span class="bd-seg" role="group" aria-label="Phase shift"><button type="button" data-ps="0" aria-pressed="true">no shift</button><button type="button" data-ps="1" aria-pressed="false">λ/4 shift (cavity)</button></span></div>
  <div class="bd-sliders">
    <label class="bd-sl"><span>grating period Λ <b data-v="P"></b></span><input type="range" data-k="P" min="300" max="340" step="0.1" value="317" aria-label="period"></label>
    <label class="bd-sl"><span>coupling coefficient κ <b data-v="k"></b></span><input type="range" data-k="k" min="0" max="100" step="0.1" value="50" aria-label="coupling coefficient"></label>
    <label class="bd-sl"><span>number of periods N <b data-v="N"></b></span><input type="range" data-k="N" min="10" max="2000" step="1" value="300" aria-label="number of periods"></label>
  </div>
  <div class="bd-scope tall"><canvas data-c="g" aria-hidden="true"></canvas><span class="bd-tag">geometry: zoom (top), whole grating to scale</span></div>
  <div class="bd-scope tall"><canvas data-c="s" aria-hidden="true"></canvas><span class="bd-tag">reflection and transmission against wavelength</span></div>
  <div class="bd-read" aria-live="polite"><span>λ<sub>B</sub> <b data-o="lb">–</b></span><span>κL <b data-o="kl">–</b></span><span>peak R <b data-o="r">–</b></span><span>bandwidth (nulls) <b data-o="bw">–</b></span><span>length <b data-o="len">–</b></span></div>
  <p class="bd-caption" data-o="cap"></p>
</div>
<script>
(function () {
  var root = document.getElementById('bdBragg'); if (!root || !window.BD) return;
  var q = function (s) { return root.querySelector(s); }, apo = 0, ps = 0;
  var neff0 = 2.446, ng = 4.18, lam0 = 1.55;
  var S = BD.bind(root, {
    P: { fmt: function (x) { return x.toFixed(1) + ' nm'; } },
    k: { map: function (v) { return 1000 * Math.pow(10, 2.2 * v / 100); }, fmt: function (x) { return (x / 1000).toFixed(x < 1e4 ? 2 : 1) + ' /mm'; } },   // 1e3 .. 1.6e5 /m
    N: { fmt: function (x) { return x.toFixed(0); } }
  }, function () { draw(); });
  BD.seg(root, 'apo', function (v) { apo = +v; draw(); });
  BD.seg(root, 'ps', function (v) { ps = +v; draw(); });
  // complex 2x2 helpers: matrices as [a, b, c, d] with complex entries [re, im]
  function cm(a, b) { return [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]]; }
  function ca(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
  function mm(A, B) { return [ca(cm(A[0], B[0]), cm(A[1], B[2])), ca(cm(A[0], B[1]), cm(A[1], B[3])), ca(cm(A[2], B[0]), cm(A[3], B[2])), ca(cm(A[2], B[1]), cm(A[3], B[3]))]; }
  // uniform section of length l (m), detuning sig (1/m), coupling kap (1/m): coupled-mode transfer matrix
  function sec(l, sig, kap) {
    var g2 = kap * kap - sig * sig, ch, sh_g, ss;   // sh_g = sinh(gl)/g, works for g imaginary too
    if (g2 > 0) { var gg = Math.sqrt(g2); ch = Math.cosh(gg * l); sh_g = Math.sinh(gg * l) / gg; }
    else if (g2 < 0) { var gi = Math.sqrt(-g2); ch = Math.cos(gi * l); sh_g = Math.sin(gi * l) / gi; }
    else { ch = 1; sh_g = l; }
    return [[ch, -sig * sh_g], [0, -kap * sh_g], [0, kap * sh_g], [ch, sig * sh_g]];
  }
  function spectrum(lam, nsec) {
    var neff = neff0 - (ng - neff0) * (lam - lam0) / lam0, P = S.P * 1e-9, sig = 2 * Math.PI * neff / (lam * 1e-6) - Math.PI / P;
    var L = S.N * P, l = L / nsec, T = [[1, 0], [0, 0], [0, 0], [1, 0]];
    for (var i = 0; i < nsec; i++) {
      var z = (i + 0.5) / nsec - 0.5, kap = S.k * (apo ? Math.exp(-Math.pow(z / 0.22, 2)) : 1);
      T = mm(T, sec(l, sig, kap));
      if (ps && i === nsec / 2 - 1) T = mm(T, [[0, -1], [0, 0], [0, 0], [0, 1]]);   // grating phase shift of pi (half a period = lambda/4): diag(e^{-j pi/2}, e^{j pi/2})
    }
    var a = T[0], c = T[2], d2 = a[0] * a[0] + a[1] * a[1];
    return (c[0] * c[0] + c[1] * c[1]) / d2;
  }
  function draw() {
    var lb = 2 * neff0 * S.P / 1000, L = S.N * S.P * 1e-9, kl = S.k * L;
    // centre on the Bragg wavelength including dispersion: lambda_B = 2 neff(lambda_B) Lambda
    for (var it = 0; it < 20; it++) lb = 2 * (neff0 - (ng - neff0) * (lb - lam0) / lam0) * S.P / 1000;
    var bwEst = lb * lb / (ng * L * 1e6) * Math.sqrt(Math.pow(kl / Math.PI, 2) + 1);   // um, null-to-null
    var span = Math.min(Math.max(3 * bwEst, 0.004), 0.12), l0 = lb - span / 2, l1 = lb + span / 2;
    var nsec = apo ? 40 : (ps ? 2 : 1), xs = [], R = [], T = [], Np = 900, rmax = 0;
    for (var i = 0; i <= Np; i++) { var l = l0 + (l1 - l0) * i / Np, r = spectrum(l, nsec); xs.push(l); R.push(r); T.push(1 - r); rmax = Math.max(rmax, r); }
    var dv = BD.setup(q('[data-c="s"]')), f = BD.frame(dv, { x: [l0, l1], y: [0, 1.02], pad: { l: 40, b: 22 },
      xt: [[l0, (1000 * l0).toFixed(1)], [lb, (1000 * lb).toFixed(1) + ' nm'], [l1, (1000 * l1).toFixed(1)]], yt: [[0, '0'], [0.5, '0.5'], [1, '1']] });
    BD.line(f, xs, T, BD.C.blue, 1.4); BD.line(f, xs, R, BD.C.gold, 2);
    dv.g.fillStyle = BD.C.gold; dv.g.fillText('R', f.p.l + 6, f.p.t + 12); dv.g.fillStyle = BD.C.blue; dv.g.fillText('T', f.p.l + 22, f.p.t + 12);
    // ---- geometry: a magnified stretch of the corrugated waveguide (one outline, no seams), linked to the whole grating below
    (function () {
      var dv2 = BD.setup(q('[data-c="g"]')), gg = dv2.g, W = dv2.w, H = dv2.h, w0 = 0.5, P = S.P / 1000, nP = 12;
      var dw = 0.015 + 0.085 * (Math.log10(S.k) - 3) / 2.2;          // half corrugation, drawn to grow with kappa (illustrative)
      var segL = nP * P + (ps ? P / 2 : 0), topB = H * 0.62, sc = Math.min((W - 150) / segL, 74 / (w0 + 2 * dw), (topB - 86) / (w0 + 2 * dw));
      var x0 = (W - segL * sc) / 2, yc = 48 + (topB - 48 - 30) / 2, Yt = function (h) { return yc - h * sc; }, Yb = function (h) { return yc + h * sc; };
      // outline of the square-wave edge: wide half then narrow half each period; a lambda/4 shift inserts an extra narrow half-period
      var edge = [], x = x0;
      for (var i = 0; i < nP; i++) {
        if (ps && i === nP / 2) { edge.push([x, w0 / 2 - dw], [x + P / 2 * sc, w0 / 2 - dw]); x += P / 2 * sc; }
        edge.push([x, w0 / 2 + dw], [x + P / 2 * sc, w0 / 2 + dw], [x + P / 2 * sc, w0 / 2 - dw], [x + P * sc, w0 / 2 - dw]); x += P * sc;
      }
      gg.fillStyle = BD.GEO.si; gg.beginPath();
      gg.moveTo(12, Yt(w0 / 2)); gg.lineTo(x0, Yt(w0 / 2));                                  // lead-in waveguide, top edge
      edge.forEach(function (p) { gg.lineTo(p[0], Yt(p[1])); });
      gg.lineTo(x, Yt(w0 / 2)); gg.lineTo(W - 12, Yt(w0 / 2)); gg.lineTo(W - 12, Yb(w0 / 2)); gg.lineTo(x, Yb(w0 / 2));
      for (var j = edge.length - 1; j >= 0; j--) gg.lineTo(edge[j][0], Yb(edge[j][1]));
      gg.lineTo(x0, Yb(w0 / 2)); gg.lineTo(12, Yb(w0 / 2)); gg.closePath(); gg.fill();
      gg.fillStyle = BD.GEO.glow + '0.35)'; gg.fillRect(12, yc - 2, W - 24, 4);              // the guided light along the core
      // dimensions
      BD.dim(gg, x0, Yt(w0 / 2 + dw) - 10, x0 + P * sc, Yt(w0 / 2 + dw) - 10, 'Λ = ' + S.P.toFixed(1) + ' nm', BD.C.gold, -6);
      var narrow = W < 560;
      if (!narrow) BD.label(gg, 'waveguide 500 nm wide', 14, Yt(w0 / 2) - 6, BD.C.axis);
      BD.label(gg, narrow ? '±' + Math.round(1000 * dw) + ' nm corrugation (illustrative)' : 'corrugation ±' + Math.round(1000 * dw) + ' nm (illustrative: grows with κ)', narrow ? W / 2 : x0, Yb(w0 / 2 + dw) + 16, BD.C.dim, narrow ? 'center' : 'left');
      if (ps) { var xs = x0 + (nP / 2) * P * sc; gg.strokeStyle = BD.C.red; gg.setLineDash([3, 3]); gg.beginPath(); gg.moveTo(xs + P / 4 * sc, Yt(w0 / 2 + dw) - 4); gg.lineTo(xs + P / 4 * sc, Yb(w0 / 2 + dw) + 4); gg.stroke(); gg.setLineDash([]);
                BD.label(gg, 'λ/4 shift', xs + P / 4 * sc, Yt(w0 / 2 + dw) - 20, BD.C.red, 'center'); }
      // the whole grating to scale, with its coupling profile; the bracket shows where the magnified stretch sits
      var yb = H - 44, xL = 60, xR = W - 60, Lum = S.N * P, sxl = (xR - xL) / Lum, hmax = 9;
      gg.fillStyle = BD.GEO.si; gg.fillRect(12, yb - 2, W - 24, 4);
      gg.fillStyle = 'rgba(157,179,204,.55)'; gg.beginPath(); gg.moveTo(xL, yb);
      for (var m = 0; m <= 120; m++) { var z = m / 120 - 0.5, kk = apo ? Math.exp(-Math.pow(z / 0.22, 2)) : 1; gg.lineTo(xL + (m / 120) * (xR - xL), yb - 2 - hmax * kk); }
      for (m = 120; m >= 0; m--) { z = m / 120 - 0.5; kk = apo ? Math.exp(-Math.pow(z / 0.22, 2)) : 1; gg.lineTo(xL + (m / 120) * (xR - xL), yb + 2 + hmax * kk); }
      gg.closePath(); gg.fill();
      if (ps) { gg.fillStyle = BD.C.red; gg.fillRect((xL + xR) / 2 - 1, yb - hmax - 6, 2, 2 * hmax + 12); }
      var zx = ps ? (xL + xR) / 2 : xL + 0.06 * (xR - xL), zw = Math.max(3, segL * sxl);    // where the magnified view comes from
      gg.strokeStyle = BD.C.gold; gg.strokeRect(zx - zw / 2, yb - hmax - 4, zw, 2 * hmax + 8);
      gg.setLineDash([2, 3]); gg.beginPath(); gg.moveTo(zx - zw / 2, yb - hmax - 4); gg.lineTo(x0, Yb(w0 / 2 + dw) + 22); gg.moveTo(zx + zw / 2, yb - hmax - 4); gg.lineTo(x, Yb(w0 / 2 + dw) + 22); gg.stroke(); gg.setLineDash([]);
      BD.dim(gg, xL, yb + hmax + 8, xR, yb + hmax + 8, 'L = ' + Lum.toFixed(0) + ' µm, ' + S.N.toFixed(0) + ' periods' + (apo ? ', Gaussian apodisation' : ''), BD.C.axis, 11);
    })();
    q('[data-o="lb"]').textContent = (1000 * lb).toFixed(2) + ' nm';
    q('[data-o="kl"]').textContent = kl.toFixed(2);
    q('[data-o="r"]').textContent = (100 * rmax).toFixed(1) + ' %' + (ps ? '' : ' (tanh²κL = ' + (100 * Math.pow(Math.tanh(kl), 2)).toFixed(1) + ' %)');
    q('[data-o="bw"]').textContent = (1000 * bwEst).toFixed(2) + ' nm';
    q('[data-o="len"]').textContent = (L * 1e6).toFixed(0) + ' µm';
    var c = 'Each period reflects a little; at the Bragg wavelength λ<sub>B</sub> = 2n<sub>eff</sub>Λ the reflections add in phase. ';
    if (ps) c += '<b>A quarter-wave shift in the middle turns the grating into a cavity</b>: a narrow transmission peak opens at the centre of the stop-band. The same idea makes a DFB laser single-mode (Chapter 26).';
    else if (kl < 1) c += 'With κL below 1 the grating is weak: the peak reflectivity is low and the bandwidth is set by the length, not by κ.';
    else c += 'With κL = ' + kl.toFixed(1) + ' the peak reflectivity is tanh²(κL); a stronger corrugation widens the stop-band, a longer grating sharpens its edges.';
    if (apo && !ps) c += ' Apodising the coupling along the grating suppresses the side lobes at the price of a slightly narrower, lower peak.';
    q('[data-o="cap"]').innerHTML = c;
  }
  BD.observe(root, draw);
})();
</script>
