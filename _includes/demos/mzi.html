{% include demos/assets.html %}
<div class="bd" id="bdMzi" role="group" aria-label="Interactive demo: transmission of a Mach–Zehnder interferometer">
  <div class="bd-head"><span>// try it · Mach–Zehnder interferometer (2 × 2, Si strip waveguides)</span>
    <span class="bd-seg" role="group" aria-label="Output port"><button type="button" data-port="both" aria-pressed="true">both ports</button><button type="button" data-port="db" aria-pressed="false">dB scale</button></span></div>
  <div class="bd-sliders">
    <label class="bd-sl"><span>arm-length difference ΔL <b data-v="dL"></b></span><input type="range" data-k="dL" min="0" max="300" step="0.5" value="100" aria-label="arm length difference"></label>
    <label class="bd-sl"><span>first splitter (to lower arm) <b data-v="k1"></b></span><input type="range" data-k="k1" min="0.2" max="0.8" step="0.005" value="0.5" aria-label="first splitter ratio"></label>
    <label class="bd-sl"><span>second splitter <b data-v="k2"></b></span><input type="range" data-k="k2" min="0.2" max="0.8" step="0.005" value="0.5" aria-label="second splitter ratio"></label>
    <label class="bd-sl"><span>phase shifter on the long arm <b data-v="ph"></b></span><input type="range" data-k="ph" min="0" max="2" step="0.01" value="0" aria-label="phase shift"></label>
    <label class="bd-sl"><span>waveguide loss <b data-v="a"></b></span><input type="range" data-k="a" min="0" max="20" step="0.1" value="3" aria-label="loss"></label>
  </div>
  <div class="bd-scope"><canvas data-c="g" aria-hidden="true"></canvas><span class="bd-tag">geometry: top view (line width ∝ power at 1550 nm)</span></div>
  <div class="bd-scope tall"><canvas data-c="s" aria-hidden="true"></canvas><span class="bd-tag">transmission against wavelength</span></div>
  <div class="bd-read" aria-live="polite"><span>FSR <b data-o="fsr">–</b></span><span>extinction (bar port) <b data-o="er">–</b></span><span>n<sub>g</sub> <b>4.20</b></span><span>excess loss <b data-o="il">–</b></span></div>
  <p class="bd-caption" data-o="cap"></p>
</div>
<script>
(function () {
  var root = document.getElementById('bdMzi'); if (!root || !window.BD) return;
  var q = function (s) { return root.querySelector(s); }, db = false;
  var neff0 = 2.44, ng = 4.2, lam0 = 1.55, L0 = 200;   // um; L0 = length of the short arm
  var S = BD.bind(root, {
    dL: { fmt: function (x) { return x.toFixed(1) + ' µm'; } }, k1: { fmt: function (x) { return (100 * x).toFixed(1) + ' %'; } },
    k2: { fmt: function (x) { return (100 * x).toFixed(1) + ' %'; } }, ph: { fmt: function (x) { return x.toFixed(2) + 'π'; } },
    a: { fmt: function (x) { return x.toFixed(1) + ' dB/cm'; } }
  }, function () { draw(); });
  BD.seg(root, 'port', function (v) { db = v === 'db'; draw(); });
  // returns [bar, cross] power for input at port 1; couplers [[t, -jk], [-jk, t]]
  function mzi(lam) {
    var neff = neff0 - (ng - neff0) * (lam - lam0) / lam0, beta = 2 * Math.PI * neff / lam, alpha = S.a / 4.343 * 1e-4 / 2;   // field loss per um
    var t1 = Math.sqrt(1 - S.k1), c1 = Math.sqrt(S.k1), t2 = Math.sqrt(1 - S.k2), c2 = Math.sqrt(S.k2);
    var ph1 = beta * L0, ph2 = beta * (L0 + S.dL) + Math.PI * S.ph;
    var a1 = Math.exp(-alpha * L0), a2 = Math.exp(-alpha * (L0 + S.dL));
    // after coupler 1: upper = t1, lower = -j c1; after the arms: multiply by a e^{-j ph}
    var u = [t1 * a1 * Math.cos(-ph1), t1 * a1 * Math.sin(-ph1)];
    var lr = [c1 * a2 * Math.sin(-ph2), -c1 * a2 * Math.cos(-ph2)];   // (-j c1) e^{-j ph2}
    // coupler 2: bar = t2 u + (-j c2) l ; cross = (-j c2) u + t2 l
    var bar = [t2 * u[0] + c2 * lr[1], t2 * u[1] - c2 * lr[0]];
    var crs = [c2 * u[1] + t2 * lr[0], -c2 * u[0] + t2 * lr[1]];
    return [bar[0] * bar[0] + bar[1] * bar[1], crs[0] * crs[0] + crs[1] * crs[1]];
  }
  function draw() {
    var xs = [], b = [], c = [], N = 1200, l0 = 1.5, l1 = 1.6, bmin = 1, bmax = 0;
    for (var i = 0; i <= N; i++) { var l = l0 + (l1 - l0) * i / N, r = mzi(l); xs.push(l); b.push(r[0]); c.push(r[1]); bmin = Math.min(bmin, r[0]); bmax = Math.max(bmax, r[0]); }
    var dv = BD.setup(q('[data-c="s"]')), f = BD.frame(dv, db ? { x: [l0, l1], y: [-40, 0], pad: { l: 44, b: 22 },
      xt: [[1.5, '1500'], [1.525, '1525'], [1.55, '1550'], [1.575, '1575'], [1.6, '1600 nm']], yt: [[-40, '−40'], [-20, '−20'], [0, '0 dB']] }
      : { x: [l0, l1], y: [0, 1.02], pad: { l: 44, b: 22 }, xt: [[1.5, '1500'], [1.525, '1525'], [1.55, '1550'], [1.575, '1575'], [1.6, '1600 nm']], yt: [[0, '0'], [0.5, '0.5'], [1, '1']] });
    var tr = function (v) { return db ? 10 * Math.log10(Math.max(v, 1e-6)) : v; };
    BD.line(f, xs, c.map(tr), BD.C.blue, 1.6);
    BD.line(f, xs, b.map(tr), BD.C.gold, 1.6);
    dv.g.fillStyle = BD.C.gold; dv.g.fillText('bar', f.p.l + 6, f.p.t + 12); dv.g.fillStyle = BD.C.blue; dv.g.fillText('cross', f.p.l + 36, f.p.t + 12);
    // ---- geometry: two 2x2 couplers, a straight upper arm and a lower arm with a delay loop of depth dL/2
    (function () {
      var dg = BD.setup(q('[data-c="g"]')), g = dg.g, Lb = 25, Lc = 20, sep = 24, D = S.dL / 2, wl = 20;
      var xs = [0, Lb, Lb + Lc, 2 * Lb + Lc], xS = xs[3], xE = xS + L0, Xt = xE + 2 * Lb + Lc + 30;
      var sx = (dg.w - 110) / Xt, top = 30, avail = dg.h - top - 18, sy = Math.min(sx, avail / (sep + D + 6)), k = sy / sx;
      var X = function (x) { return 12 + x * sx; }, Y = function (y) { return top + 6 + (sep / 2 - y) * sy; };
      var r = mzi(lam0), pu = 1 - S.k1, pl = S.k1, w = function (p) { return 1.6 + 5 * p; };
      function coupler(x0, upIn, loIn, upOut, loOut) {   // S-bends in, straight coupling section, S-bends out
        var g0 = 0.6;
        [[1, upIn, upOut], [-1, loIn, loOut]].forEach(function (a) {   // input half drawn with the input power, output half with the output power
          BD.wg(g, BD.sbend(X(x0), Y(a[0] * sep / 2), X(x0 + Lb), Y(a[0] * g0), 16).concat([[X(x0 + Lb + Lc / 2), Y(a[0] * g0)]]), w(a[1]));
          BD.wg(g, [[X(x0 + Lb + Lc / 2), Y(a[0] * g0)], [X(x0 + Lb + Lc), Y(a[0] * g0)]].concat(BD.sbend(X(x0 + Lb + Lc), Y(a[0] * g0), X(x0 + 2 * Lb + Lc), Y(a[0] * sep / 2), 16)), w(a[2]));
        });
      }
      coupler(0, 1, 0.04, pu, pl);
      BD.wg(g, [[X(xS), Y(sep / 2)], [X(xE), Y(sep / 2)]], w(pu));
      var xm = (xS + xE) / 2;
      BD.wg(g, [[X(xS), Y(-sep / 2)], [X(xm - wl / 2), Y(-sep / 2)], [X(xm - wl / 2), Y(-sep / 2 - D)], [X(xm + wl / 2), Y(-sep / 2 - D)], [X(xm + wl / 2), Y(-sep / 2)], [X(xE), Y(-sep / 2)]], w(pl));
      var ht = 0.25 + 0.65 * (S.ph % 2) / 2;   // heater on the long arm, brighter for more phase
      g.fillStyle = 'rgba(224,138,58,' + ht.toFixed(2) + ')'; g.fillRect(X(xS + 8), Y(-sep / 2) - 5, 50 * sx, 10);
      if (dg.w > 520) BD.label(g, 'heater ' + S.ph.toFixed(2) + 'π', X(xS + 8), Y(-sep / 2) + 16, BD.C.gold);
      coupler(xE, pu, pl, r[0], r[1]);
      var roomy = dg.w > 520;   // on narrow screens keep only the essential labels
      if (roomy) { BD.label(g, 'κ² ' + (100 * S.k1).toFixed(0) + ' %', X(Lb), Y(sep / 2) - 8, BD.C.axis); BD.label(g, 'κ² ' + (100 * S.k2).toFixed(0) + ' %', X(xE + Lb), Y(sep / 2) - 8, BD.C.axis); }
      var xo = X(xE + 2 * Lb + Lc) + 4;
      BD.label(g, 'bar ' + (100 * r[0]).toFixed(0) + ' %', xo, Y(sep / 2) + 3, BD.C.gold);
      BD.label(g, 'cross ' + (100 * r[1]).toFixed(0) + ' %', xo, Y(-sep / 2) + 3, BD.C.blue);
      BD.label(g, 'in', 2, Y(sep / 2) - 6, BD.C.white);
      if (D > 1) BD.dim(g, X(xm + wl / 2) + 10, Y(-sep / 2), X(xm + wl / 2) + 10, Y(-sep / 2 - D), 'ΔL/2 = ' + D.toFixed(1) + ' µm', BD.C.gold, -44);
      if (roomy) BD.label(g, 'short arm L = ' + L0 + ' µm', X(xm) - 50, Y(sep / 2) - 8, BD.C.axis);
      BD.scalebar(g, dg.w - 96, dg.h - 8, sx, 60);
      if (k < 0.98) BD.label(g, 'vertical ×' + k.toFixed(2), dg.w - 8, top - 10, BD.C.dim, 'right');
    })();
    var fsr = S.dL > 0 ? lam0 * lam0 / (ng * S.dL) : Infinity;
    q('[data-o="fsr"]').textContent = isFinite(fsr) ? (1000 * fsr).toFixed(2) + ' nm' : '∞ (balanced)';
    var er = 10 * Math.log10(bmax / Math.max(bmin, 1e-9));
    q('[data-o="er"]').textContent = S.dL > 0 ? (er > 60 ? '> 60 dB' : er.toFixed(1) + ' dB') : '–';
    var tot = mzi(lam0); q('[data-o="il"]').textContent = (-10 * Math.log10(tot[0] + tot[1])).toFixed(2) + ' dB';
    var cap = 'The arm-length difference sets the free spectral range, FSR = λ²/(n<sub>g</sub>ΔL), with the group index, not the effective index. ';
    if (Math.abs(S.k1 - 0.5) > 0.03 || Math.abs(S.k2 - 0.5) > 0.03) cap += '<b>Unequal splitters limit the extinction</b>: the two arms no longer cancel completely at the nulls. ';
    else cap += 'With 50/50 splitters and equal losses the nulls are deep; the extra loss of the longer arm slowly fills them in. ';
    cap += 'The phase shifter slides the fringes sideways without changing their spacing: this is how a thermal or electro-optic MZI switch works.';
    q('[data-o="cap"]').innerHTML = cap;
  }
  BD.observe(root, draw);
})();
</script>
